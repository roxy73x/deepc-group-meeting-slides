<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans SC", SimHei, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 32px; font-weight: 700; fill: #1e40af; }
    .subtitle { font-size: 17px; fill: #64748b; }
    .box-title { font-size: 22px; font-weight: 700; fill: #1e40af; }
    .green-title { font-size: 22px; font-weight: 700; fill: #15803d; }
    .body { font-size: 17px; fill: #0f172a; }
    .small { font-size: 15px; fill: #64748b; }
    .warn { font-size: 15px; fill: #92400e; font-weight: 700; }
  </style>

  <rect width="1280" height="480" fill="#ffffff"/>
  <rect x="0" y="0" width="10" height="480" fill="#2563eb"/>

  <text x="48" y="40" class="title">方法框架：UAV 场景下的 Maneuver-Aware DeePC</text>
  <text x="48" y="66" class="subtitle">两篇参考工作只作为动机来源，核心流程是本工程自己的 UAV 跟踪控制与实验验证。</text>

  <!-- Unified reference block -->
  <g filter="url(#shadow)">
    <rect x="48" y="105" width="285" height="205" rx="18" fill="#eff6ff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="190" y="140" text-anchor="middle" class="box-title">参考启发</text>
  <text x="78" y="180" class="body">Select-DeePC</text>
  <text x="98" y="206" class="small">在线选择更相关的数据</text>
  <line x1="78" y1="228" x2="303" y2="228" stroke="#bfdbfe" stroke-width="2"/>
  <text x="78" y="262" class="body">Gain-Scheduled DeePC</text>
  <text x="98" y="288" class="small">固定 DeePC 配置可能不足</text>

  <!-- Project design block -->
  <g filter="url(#shadow)">
    <rect x="395" y="90" width="500" height="240" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="645" y="126" text-anchor="middle" class="box-title">本工程设计：面向无人机轨迹跟踪的 DeePC 改造</text>

  <rect x="425" y="155" width="205" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="528" y="183" text-anchor="middle" class="body" font-weight="700">UAV 控制器适配</text>
  <text x="445" y="207" class="small">悬停中心化输入 / 安全约束</text>

  <rect x="660" y="155" width="205" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="763" y="183" text-anchor="middle" class="body" font-weight="700">软局部数据选择</text>
  <text x="686" y="207" class="small">相关列降低 g 惩罚</text>

  <rect x="425" y="245" width="205" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="528" y="273" text-anchor="middle" class="body" font-weight="700">飞行状态感知</text>
  <text x="447" y="297" class="small">根据参考轨迹与误差判断</text>

  <rect x="660" y="245" width="205" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="763" y="273" text-anchor="middle" class="body" font-weight="700">对比实验设置</text>
  <text x="686" y="297" class="small">Static / Local-data / Full aware</text>

  <!-- Online control block -->
  <g filter="url(#shadow)">
    <rect x="970" y="155" width="245" height="135" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="1092" y="193" text-anchor="middle" class="green-title">在线 DeePC 优化</text>
  <text x="1010" y="232" class="body">预测未来输出</text>
  <text x="1010" y="260" class="body">求解控制输入并滚动执行</text>

  <!-- Arrows -->
  <line x1="333" y1="208" x2="395" y2="208" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="895" y1="208" x2="970" y2="208" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M1092 290 L1092 358 L645 358 L645 330" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="870" y="380" text-anchor="middle" class="small">执行后更新历史输入输出</text>

  <!-- Validation block -->
  <g filter="url(#shadow)">
    <rect x="48" y="395" width="1165" height="66" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <text x="78" y="424" class="box-title">实验验证</text>
  <text x="220" y="421" class="body">自写简化仿真：step / figure8，多 seed 对比</text>
  <text x="220" y="447" class="body">Gazebo 高保真验证：模型更复杂，时间同步与因果记录更敏感</text>
  <rect x="880" y="417" width="300" height="32" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="1030" y="439" text-anchor="middle" class="warn">有改进，但 Gazebo 尚未稳定收敛</text>

  <text x="48" y="475" class="small">输出：一套面向 UAV tracking 的 DeePC 对比框架，而不是简单复现某一篇论文算法</text>
</svg>
