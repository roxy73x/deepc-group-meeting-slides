<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans SC", SimHei, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 30px; font-weight: 700; fill: #1e40af; }
    .subtitle { font-size: 17px; fill: #64748b; }
    .box-title { font-size: 21px; font-weight: 700; fill: #1e40af; }
    .green-title { font-size: 21px; font-weight: 700; fill: #15803d; }
    .body { font-size: 17px; fill: #0f172a; }
    .small { font-size: 15px; fill: #64748b; }
    .warn { font-size: 15px; fill: #92400e; font-weight: 700; }
  </style>

  <rect width="1280" height="540" fill="#ffffff"/>
  <rect x="0" y="0" width="10" height="540" fill="#2563eb"/>

  <text x="54" y="48" class="title">方法框架：UAV 场景下的 Maneuver-Aware DeePC</text>
  <text x="54" y="78" class="subtitle">两篇参考工作只作为动机来源，核心流程是本工程自己的 UAV 跟踪控制与实验验证。</text>

  <!-- Unified reference block -->
  <g filter="url(#shadow)">
    <rect x="54" y="122" width="280" height="210" rx="18" fill="#eff6ff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="194" y="158" text-anchor="middle" class="box-title">参考启发</text>
  <text x="82" y="198" class="body">Select-DeePC</text>
  <text x="102" y="224" class="small">在线选择更相关的数据</text>
  <line x1="82" y1="245" x2="306" y2="245" stroke="#bfdbfe" stroke-width="2"/>
  <text x="82" y="278" class="body">Gain-Scheduled DeePC</text>
  <text x="102" y="304" class="small">固定 DeePC 配置可能不足</text>

  <!-- Project design block -->
  <g filter="url(#shadow)">
    <rect x="410" y="105" width="475" height="245" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="648" y="142" text-anchor="middle" class="box-title">本工程设计：面向无人机轨迹跟踪的 DeePC 改造</text>

  <rect x="440" y="170" width="190" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="535" y="198" text-anchor="middle" class="body" font-weight="700">UAV 控制器适配</text>
  <text x="462" y="222" class="small">悬停中心化输入 / 安全约束</text>

  <rect x="660" y="170" width="190" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="755" y="198" text-anchor="middle" class="body" font-weight="700">软局部数据选择</text>
  <text x="684" y="222" class="small">相关列降低 g 惩罚</text>

  <rect x="440" y="260" width="190" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="535" y="288" text-anchor="middle" class="body" font-weight="700">飞行状态感知</text>
  <text x="461" y="312" class="small">根据参考轨迹与误差判断</text>

  <rect x="660" y="260" width="190" height="70" rx="14" fill="#f8fbff" stroke="#dbeafe" stroke-width="2"/>
  <text x="755" y="288" text-anchor="middle" class="body" font-weight="700">对比实验设置</text>
  <text x="684" y="312" class="small">Static / Local-data / Full aware</text>

  <!-- Online control block -->
  <g filter="url(#shadow)">
    <rect x="960" y="160" width="245" height="135" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <text x="1082" y="198" text-anchor="middle" class="green-title">在线 DeePC 优化</text>
  <text x="1000" y="235" class="body">预测未来输出</text>
  <text x="1000" y="263" class="body">求解控制输入并滚动执行</text>

  <!-- Arrows -->
  <line x1="334" y1="226" x2="410" y2="226" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="885" y1="226" x2="960" y2="226" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M1082 295 L1082 385 L648 385 L648 350" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="870" y="408" text-anchor="middle" class="small">执行后更新历史输入输出</text>

  <!-- Validation block -->
  <g filter="url(#shadow)">
    <rect x="54" y="425" width="1150" height="82" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <text x="85" y="458" class="box-title">实验验证</text>
  <text x="230" y="458" class="body">自写简化仿真：step / figure8，多 seed 对比</text>
  <text x="230" y="486" class="body">Gazebo 高保真验证：模型更复杂，时间同步与因果记录更敏感</text>
  <rect x="875" y="450" width="295" height="36" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="1022" y="474" text-anchor="middle" class="warn">有改进，但 Gazebo 尚未稳定收敛</text>

  <text x="54" y="528" class="small">输出：一套面向 UAV tracking 的 DeePC 对比框架，而不是简单复现某一篇论文算法</text>
</svg>
